# 저녁 학습 리마인더 스케줄러 (무료 대안 — Vercel Pro 크론 대신 GitHub Actions)
# ─────────────────────────────────────────────────────────────────────────────
#   · 매시 정각(UTC)에 배포된 Vercel 엔드포인트를 호출한다.
#   · 각 사용자의 로컬 시각/목표 미달성 여부 판정은 api/send-reminders.js 가 담당.
#   · GitHub Actions 무료 사용량으로 충분(월 ~720회 × 수 초). 공개 저장소는 무제한.
#
#   저장소 설정에서 아래 두 가지를 등록해야 동작한다:
#     Settings → Secrets and variables → Actions
#       - Variable  REMINDER_ENDPOINT : https://<배포도메인>/api/send-reminders
#       - Secret    CRON_SECRET       : Vercel 환경변수 CRON_SECRET 과 동일 값
#
#   ※ GitHub Actions 크론은 '베스트 에포트'라 몇 분 지연될 수 있으나, 하루
#     리마인더 용도로는 문제없다. 수동 실행(workflow_dispatch)으로 테스트 가능.
name: Send study reminders

on:
  schedule:
    - cron: '0 * * * *' # 매시 정각(UTC)
  workflow_dispatch: {} # 수동 실행(테스트용)

# 이전 실행이 밀려도 중복 실행되지 않도록
concurrency:
  group: send-reminders
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder endpoint
        env:
          ENDPOINT: ${{ vars.REMINDER_ENDPOINT }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ENDPOINT" ]; then
            echo "REMINDER_ENDPOINT variable is not set"; exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SECRET" \
            "$ENDPOINT")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" = "200"
