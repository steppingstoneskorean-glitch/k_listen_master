# 해설 ja/es 자동 번역 스케줄러 (무료 대안 — Vercel Pro 크론 대신 GitHub Actions)
# ─────────────────────────────────────────────────────────────────────────────
#   · 배포된 Vercel 엔드포인트(api/translate-explanations)를 주기적으로 호출한다.
#   · 운영자가 스튜디오에서 퀴즈를 배포하면, 다음 실행 때 ja/es 누락 해설이
#     자동 번역·저장된다(한국어는 손대지 않음 — 서버 측 가드로 강제).
#   · Hobby 60초 상한 때문에 한 번에 다 못 끝내도, 15분 간격으로 이어서 수렴한다.
#
#   저장소 설정(Settings → Secrets and variables → Actions):
#     - Variable  TRANSLATE_ENDPOINT : https://<배포도메인>/api/translate-explanations
#     - Secret    CRON_SECRET        : Vercel 환경변수 CRON_SECRET 과 동일 값
#   Vercel 환경변수: FIREBASE_SERVICE_ACCOUNT · NVIDIA_API_KEY · CRON_SECRET
#
#   ※ 즉시 반영이 필요하면 Actions 탭에서 수동 실행(workflow_dispatch) 가능.
name: Translate explanations

on:
  schedule:
    - cron: '*/15 * * * *' # 15분마다(UTC). 새 배포 해설을 곧 채운다.
  workflow_dispatch: {} # 수동 실행(배포 직후 즉시 반영용)

# 이전 실행이 밀려도 중복 실행되지 않도록
concurrency:
  group: translate-explanations
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger translate endpoint
        env:
          ENDPOINT: ${{ vars.TRANSLATE_ENDPOINT }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ENDPOINT" ]; then
            echo "TRANSLATE_ENDPOINT variable is not set"; exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SECRET" \
            "$ENDPOINT")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" = "200"
